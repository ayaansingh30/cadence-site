<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Cadence</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><nav>
  <a class="logo" href="/">Cadence</a>
  <ul><li><a href="/">Home</a></li><li><a href="/prototypes">Prototypes</a></li><li><a href="/about">About</a></li><li><a href="/contact" aria-current="page">Contact</a></li></ul>
</nav></header>
<main class="wrap">
<section>
  <h1 class="page-title">Contact us</h1>
  <p>Have any comments or questions? Feel free to reach out using the form below, and we'll get back as soon as we can. </p>

  <!-- Replace YOUR_FORM_ID with your Formspree form ID (the end of your https://formspree.io/f/... URL) -->
  <form id="contact-form" action="https://formspree.io/f/mnppgeok" method="POST" autocomplete="off" novalidate>
    <label>Your name <input type="text" name="name" required></label>
    <label>Your email <input type="email" name="email" required></label>
    <label>Message <textarea name="message" required></textarea></label>
    <button class="btn" type="submit">Send message</button>
  </form>
  <p id="form-status" role="status"></p>
</section>
</main>
<footer><div class="wrap">&copy; 2026 Team Cadence</div></footer>
<script>
  const form = document.getElementById('contact-form');
  const status = document.getElementById('form-status');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    form.classList.add('submitted');
    if (!form.checkValidity()) { status.textContent = ''; return; }
    status.textContent = 'Sending...';
    try {
      const res = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        form.reset();
        form.classList.remove('submitted');
        status.textContent = 'Thanks! Your message was sent. We will get back to you soon.';
      } else {
        status.textContent = 'Something went wrong. Please try again later.';
      }
    } catch (err) {
      status.textContent = 'Could not send. Check your connection and try again.';
    }
  });
</script>
</body>
</html>
